<!doctype html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Muistoissa</title>
  <link rel="stylesheet" href="/public.css">
</head>
<body>
  <div class="memorial-shell">
    <header class="memorial-topbar">
      <div class="memorial-mark" id="memorial-mark">Muistoissa</div>
      <div class="lang-switch" role="group" aria-label="Language switch">
        <button type="button" id="lang-fi" class="active">FI</button>
        <button type="button" id="lang-en">EN</button>
      </div>
    </header>

    <main class="memorial-page">
      <section class="state-panel" id="state-panel">
        <div class="state-eyebrow" id="state-eyebrow">Muistoissa</div>
        <h1 class="state-title" id="state-title">Ladataan muistosivua</h1>
        <p class="state-text" id="state-text">Hetki vain.</p>
      </section>

      <article class="memorial-content" id="memorial-content" hidden>
        <section class="memorial-hero">
          <div class="hero-copy">
            <div class="hero-kicker" id="hero-kicker"></div>
            <h1 class="memorial-name" id="memorial-name"></h1>
            <div class="memorial-dates" id="memorial-dates"></div>
            <p class="memorial-epitaph" id="memorial-epitaph"></p>
            <div class="memory-lead" id="memory-lead"></div>
          </div>

          <div class="hero-visual" id="hero-visual">
            <figure class="hero-frame" id="hero-frame" hidden>
              <img id="hero-image" src="" alt="">
            </figure>
            <div class="hero-placeholder" id="hero-placeholder">
              <div class="placeholder-ornament"></div>
              <div class="placeholder-copy" id="hero-placeholder-copy"></div>
            </div>
          </div>
        </section>

        <section class="gallery-section" id="gallery-section" hidden>
          <div class="section-head">
            <h2 id="gallery-title">Muistoja kuvina</h2>
          </div>
          <div class="gallery-grid" id="gallery-grid"></div>
        </section>

        <section class="story-section" id="story-section" hidden>
          <div class="section-head">
            <h2 id="story-title">Elämän tarina</h2>
          </div>
          <div class="story-body" id="story-body"></div>
        </section>
      </article>
    </main>
  </div>

  <script src="/public.js"></script>
</body>
</html>
