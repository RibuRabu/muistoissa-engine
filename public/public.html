<!doctype html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Muistoissa</title>
  <link rel="stylesheet" href="/public.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <div class="site-mark" id="site-mark">MUISTOISSA</div>
      <div class="lang-switch" role="group" aria-label="Language switch">
        <button type="button" id="lang-fi" class="active">FI</button>
        <button type="button" id="lang-en">EN</button>
      </div>
    </div>
  </header>

  <main class="page-main">
    <section class="page-state" id="page-state">
      <p class="page-state__kicker" id="state-kicker">Muistoissa</p>
      <h1 class="page-state__title" id="state-title">Ladataan muistosivua</h1>
      <p class="page-state__text" id="state-text">Hetki vain.</p>
    </section>

    <article class="memorial-page" id="memorial-article" hidden>
      <section class="scene-root" id="scene-root" aria-labelledby="memorial-name">
        <div class="scene-chamber">
          <div class="scene-layer scene-layer--backdrop"></div>
          <div class="scene-layer scene-layer--depth">
            <div class="depth-pillar depth-pillar--left"></div>
            <div class="depth-pillar depth-pillar--right"></div>
            <div class="depth-aperture"></div>
          </div>
          <div class="scene-layer scene-layer--light">
            <div class="light-shaft light-shaft--center"></div>
            <div class="light-shaft light-shaft--left"></div>
            <div class="light-shaft light-shaft--right"></div>
          </div>
          <div class="scene-layer scene-layer--fog">
            <div class="fog-band fog-band--upper"></div>
            <div class="fog-band fog-band--lower"></div>
          </div>
          <div class="scene-layer scene-layer--floor">
            <div class="floor-plane"></div>
            <div class="floor-reflection"></div>
          </div>
          <div class="scene-layer scene-layer--monolith">
            <div class="monolith-frame">
              <div class="monolith-artifact" id="artifact-frame" hidden>
                <img id="artifact-image" src="" alt="">
              </div>
              <div class="monolith-inscription">
                <p class="monolith-type" id="memorial-type"></p>
                <h1 class="monolith-name" id="memorial-name"></h1>
                <p class="monolith-dates" id="memorial-dates"></p>
                <p class="monolith-identity-details" id="identity-details-below-name" hidden></p>
              </div>
            </div>
          </div>
          <div class="scene-layer scene-layer--particles"></div>
          <div class="scene-layer scene-layer--quote">
            <p class="scene-identity-details" id="identity-details-above-epitaph" hidden></p>
            <blockquote class="scene-epitaph" id="memorial-epitaph"></blockquote>
          </div>
        </div>
      </section>

      <section class="content-overlay" id="content-overlay">
        <div class="overlay-layer overlay-layer--memory" id="memory-layer" hidden>
          <p class="overlay-kicker" id="memory-kicker">Muisto</p>
          <p class="overlay-identity-details" id="identity-details-memory" hidden></p>
          <div class="overlay-body" id="memory-text"></div>
        </div>

        <div class="overlay-layer overlay-layer--story" id="story-layer" hidden>
          <p class="overlay-kicker" id="story-kicker">Elaman tarina</p>
          <div class="overlay-body overlay-body--story" id="story-body"></div>
        </div>
      </section>
    </article>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <span id="footer-mark">Muistoissa</span>
    </div>
  </footer>

  <script src="/public.js"></script>
</body>
</html>
